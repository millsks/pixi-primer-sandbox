[workspace]
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
name = "pixi-primer-sandbox"
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"
requires-pixi = ">=0.81"

[tasks]
ci = { depends-on = [{ task = "docs-build", environment = "docs" }], description = "Full validation: strict site build (runs in the docs environment)" }

[dependencies]
python = "3.14.*"

[feature.docs.dependencies]
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.7.7,<10"

[feature.docs.pypi-dependencies]
mkdocs-same-dir = ">=0.1.5, <0.2"

[feature.docs.tasks]
docs-build = { cmd = "mkdocs build --strict", env = { DISABLE_MKDOCS_2_WARNING = "true" }, description = "Build the site into site/ (strict: warnings fail)" }
docs-serve = { cmd = "mkdocs serve --strict --dev-addr 127.0.0.1:8000", env = { DISABLE_MKDOCS_2_WARNING = "true" }, description = "Live-reloading preview at http://127.0.0.1:8000" }
docs-clean = { cmd = "rm -rf site", description = "Remove the built site" }

[environments]
docs = { features = ["docs"], solve-group = "default" }
default = { solve-group = "default" }
