[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "import-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "rich>=14",
  "httpx>=0.28",
  "structlog>=25",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/import_lab"]
